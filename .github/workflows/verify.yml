name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Static checks and tests
        run: npm run verify:all

      - name: Package check
        run: npm run verify:package

      # Chrome is preinstalled on ubuntu-latest but can lag behind the
      # extension floor, so install the current stable build explicitly.
      - name: Install Google Chrome
        run: |
          sudo curl -fsSLo /usr/share/keyrings/google-chrome-archive-keyring.gpg https://dl.google.com/linux/linux_signing_key.pub
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-archive-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -y && sudo apt-get install -y google-chrome-stable

      - name: Browser check (Chrome)
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -y && sudo apt-get install -y xvfb
          fi
          xvfb-run -a node tools/verify-browser.mjs --browser chrome

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output/
          if-no-files-found: ignore