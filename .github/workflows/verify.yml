name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Static checks and tests
        run: npm run verify:all

      - name: Package check
        run: npm run verify:package

      # Branded Google Chrome ignores --load-extension since Chrome 137, which
      # leaves the extension without content scripts or dynamic rules under the
      # test launch flags. Chrome for Testing is the same stable version and
      # keeps the flag supported for automation.
      - name: Install Chrome for Testing
        run: |
          curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" -o "$RUNNER_TEMP/cft.json"
          DOWNLOAD_URL=$(node -e "const data = require(process.argv[1]); const build = data.channels.Stable.downloads.chrome.find((item) => item.platform === 'linux64'); process.stdout.write(build.url);" "$RUNNER_TEMP/cft.json")
          curl -fsSL "$DOWNLOAD_URL" -o "$RUNNER_TEMP/chrome-linux64.zip"
          unzip -q "$RUNNER_TEMP/chrome-linux64.zip" -d "$RUNNER_TEMP/chrome"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: Browser check (Chrome)
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -y && sudo apt-get install -y xvfb
          fi
          xvfb-run -a node tools/verify-browser.mjs --browser "$CHROME_PATH"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output/
          if-no-files-found: ignore