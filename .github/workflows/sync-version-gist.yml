name: sync-version-gist

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      gist: write
    steps:
      - uses: actions/checkout@v4

      - name: Update the update-check gist to the tagged version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          printf '{"latest":"%s","note":"see https://github.com/supposedtobescruz/anti-ip-logger/releases"}\n' "$VERSION" > anti-ip-logger-version.json
          gh gist edit 24839c62c646644124a1f0b76492c75f --filename anti-ip-logger-version.json anti-ip-logger-version.json
